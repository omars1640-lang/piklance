<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - PikLance</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #F8F9FD;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .register-box {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem;
      width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .logo { text-align: center; font-size: 1.8rem; font-weight: 800; margin-bottom: 1.5rem; }
    .logo span { color: #6C5CE7; }
    h2 { text-align: center; margin-bottom: 1.5rem; }
    .type-selector { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .type-btn {
      flex: 1;
      padding: 1rem;
      border: 2px solid #E2E8F0;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      transition: 0.3s;
    }
    .type-btn.active { border-color: #6C5CE7; background: #F3F0FF; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: #6C5CE7; }
    .btn {
      width: 100%;
      padding: 0.8rem;
      background: #6C5CE7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      margin-top: 1rem;
    }
    .btn:hover { background: #5A4BD1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .back-link { display: block; text-align: center; margin-top: 1rem; color: #636E72; text-decoration: none; }
    .hidden { display: none; }
    .alert {
      padding: 0.8rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-info { background: #E3F2FD; border-right: 4px solid #6C5CE7; }
    .alert-warning { background: #FFF3CD; border-right: 4px solid #F59E0B; }
  </style>
</head>
<body>
  <div class="register-box">
    <div class="logo">Pik<span>Lance</span></div>
    <h2>إنشاء حساب جديد</h2>

    <div class="type-selector">
      <button class="type-btn active" id="buyerTypeBtn" onclick="selectType('buyer')">🛍️ عميل</button>
      <button class="type-btn" id="freelancerTypeBtn" onclick="selectType('freelancer')">🎨 مستقل</button>
    </div>

    <div id="buyerForm">
      <div class="alert alert-info">⚡ تفعيل فوري - بدون انتظار موافقة</div>
      <div class="form-group"><label>الاسم الكامل</label><input type="text" id="buyerName" placeholder="اسمك الكامل"></div>
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="buyerEmail" placeholder="example@email.com"></div>
      <div class="form-group"><label>رقم الهاتف</label><input type="text" id="buyerPhone" placeholder="09xxxxxxxx"></div>
      <div class="form-group"><label>كلمة المرور</label><input type="password" id="buyerPassword" placeholder="8 أحرف على الأقل"></div>
      <button class="btn" onclick="registerBuyer()">إنشاء حساب</button>
    </div>

    <div id="freelancerForm" class="hidden">
      <div class="alert alert-warning">🔒 سيتم مراجعة طلبك خلال 24 ساعة</div>
      <div class="form-group"><label>الاسم الكامل</label><input type="text" id="freelancerName" placeholder="اسمك الكامل"></div>
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="freelancerEmail" placeholder="example@email.com"></div>
      <div class="form-group"><label>رقم الهاتف</label><input type="text" id="freelancerPhone" placeholder="09xxxxxxxx"></div>
      <div class="form-group"><label>التخصص</label><select id="freelancerSpecialty"><option value="">اختر تخصصك</option><option value="design">تصميم</option><option value="web">برمجة</option><option value="writing">كتابة</option><option value="marketing">تسويق</option></select></div>
      <div class="form-group"><label>كلمة المرور</label><input type="password" id="freelancerPassword" placeholder="8 أحرف على الأقل"></div>
      <button class="btn" onclick="registerFreelancer()">تقديم الطلب</button>
    </div>

    <a href="index.html" class="back-link">← العودة للرئيسية</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMrfgQ1kcfPMF-qLM_88HqZUki-xU7OW4",
      authDomain: "piklance-c2651.firebaseapp.com",
      projectId: "piklance-c2651",
      storageBucket: "piklance-c2651.firebasestorage.app",
      messagingSenderId: "290309648200",
      appId: "1:290309648200:web:b5948813ef1087ab0ccd7d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.selectType = function(type) {
      document.getElementById('buyerTypeBtn').classList.toggle('active', type === 'buyer');
      document.getElementById('freelancerTypeBtn').classList.toggle('active', type === 'freelancer');
      document.getElementById('buyerForm').classList.toggle('hidden', type !== 'buyer');
      document.getElementById('freelancerForm').classList.toggle('hidden', type !== 'freelancer');
    };

    window.registerBuyer = async function() {
      const name = document.getElementById('buyerName').value.trim();
      const email = document.getElementById('buyerEmail').value.trim();
      const password = document.getElementById('buyerPassword').value;

      if (!name || !email || !password) { alert('يرجى ملء جميع الحقول'); return; }
      if (password.length < 6) { alert('كلمة المرور 6 أحرف على الأقل'); return; }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", userCredential.user.uid), {
          name, email, accountType: 'buyer', status: 'active', createdAt: new Date().toISOString()
        });
        await sendEmailVerification(userCredential.user);
        alert('✅ تم إنشاء الحساب بنجاح!');
        window.location.href = 'index.html';
      } catch (error) {
        alert('❌ خطأ: ' + error.message);
      }
    };

    window.registerFreelancer = async function() {
      const name = document.getElementById('freelancerName').value.trim();
      const email = document.getElementById('freelancerEmail').value.trim();
      const password = document.getElementById('freelancerPassword').value;
      const specialty = document.getElementById('freelancerSpecialty').value;

      if (!name || !email || !password || !specialty) { alert('يرجى ملء جميع الحقول'); return; }
      if (password.length < 6) { alert('كلمة المرور 6 أحرف على الأقل'); return; }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", userCredential.user.uid), {
          name, email, accountType: 'freelancer', specialty, status: 'pending', createdAt: new Date().toISOString()
        });
        alert('✅ تم تقديم طلبك للمراجعة');
        window.location.href = 'index.html';
      } catch (error) {
        alert('❌ خطأ: ' + error.message);
      }
    };
  </script>
</body>
</html>
